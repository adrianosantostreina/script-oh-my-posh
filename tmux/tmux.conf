# tmux do Adriano: barra de status na paleta Night Owl. Compativel com tmux 3.1 a 3.4.
# Instalar:  cp tmux/tmux.conf ~/.tmux.conf  e  cp scripts/tmux-status.sh ~/scripts/  (chmod +x)
# Recarregar dentro do tmux: prefixo (Ctrl+b) e depois r

# ---- geral ----
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"       # cores de 24 bits
set -g mouse on                                  # no Windows Terminal, selecionar texto = Shift + arrastar
set -g history-limit 20000
set -g escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S - #h"

# ---- barra de status (embaixo) ----
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#011627,fg=#d6deeb"
set -g status-justify left

set -g status-left-length 50
set -g status-left "#[bg=#21c7a8,fg=#011627,bold] #S #[bg=#011627,fg=#82aaff,nobold] #(id -un)@#h  "

set -g status-right-length 120
set -g status-right "#[fg=#637777]cpu #(~/scripts/tmux-status.sh cpu) #[fg=#637777]ram #(~/scripts/tmux-status.sh ram) #[fg=#637777]disco #(~/scripts/tmux-status.sh disk) #[fg=#637777]load #[fg=#d6deeb]#(~/scripts/tmux-status.sh load) #[fg=#c792ea] %d/%m %H:%M "

setw -g window-status-format "#[fg=#637777] #I:#W "
setw -g window-status-current-format "#[bg=#82aaff,fg=#011627,bold] #I:#W "
setw -g window-status-separator ""

# ---- paineis e mensagens ----
set -g pane-border-style "fg=#1d3b53"
set -g pane-active-border-style "fg=#21c7a8"
set -g message-style "bg=#82aaff,fg=#011627"

# ---- atalhos (prefixo continua Ctrl+b) ----
bind | split-window -h -c "#{pane_current_path}"     # divide ao lado
bind - split-window -v -c "#{pane_current_path}"     # divide embaixo
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux.conf recarregado"
